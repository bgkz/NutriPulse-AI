services:
  db:
    image: postgres:17
    container_name: nutripulse-db

    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_db

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: nutripulse-redis
    ports:
      - "6379:6379"
  worker:
    build: ./backend
    command: rq worker --url redis://redis:6379
    depends_on:
      - redis

volumes:
  postgres_data:
